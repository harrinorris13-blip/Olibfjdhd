<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--panel2:#272727;--text:#f1f1f1;--muted:#aaa;--line:#303030;--accent:#ff0033}
:root.light{color-scheme:light;--bg:#fff;--panel:#f8f8f8;--panel2:#eee;--text:#171717;--muted:#606060;--line:#ddd;--accent:#e60023}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}header{height:58px;position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:bold;white-space:nowrap}.logo{width:31px;height:22px;background:#ff0033;border-radius:7px;display:grid;place-items:center}.logo:after{content:"";border-left:9px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}.search{display:flex;max-width:620px;flex:1;margin:auto}.search input{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid #444;border-radius:22px 0 0 22px;padding:11px 17px;outline:none}.search input:focus{border-color:#3b82f6}.search button{background:var(--panel2);border:1px solid #444;border-left:0;border-radius:0 22px 22px 0;padding:0 20px}.head-actions{display:flex;gap:8px}.round{background:var(--panel2);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:18px}.layout{display:flex}.sidebar{width:210px;flex-shrink:0;padding:14px 10px;height:calc(100vh - 58px);position:sticky;top:58px;overflow:auto}.navbtn{width:100%;display:flex;align-items:center;gap:20px;text-align:left;padding:12px;border-radius:10px;background:transparent;color:var(--text)}.navbtn:hover,.navbtn.active{background:var(--panel2)}.navbtn .ico{width:23px;text-align:center;font-size:19px}.navlabel{padding:17px 12px 8px;font-weight:bold}.separator{border-top:1px solid var(--line);margin:12px 0}.main{min-width:0;flex:1;padding:18px 22px 60px}.chips{display:flex;gap:10px;overflow:auto;padding:0 0 20px;scrollbar-width:none}.chip{white-space:nowrap;background:var(--panel2);padding:9px 14px;border-radius:8px}.chip.active{background:var(--text);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 17px}.video{min-width:0;cursor:pointer}.thumb{position:relative;aspect-ratio:16/9;background:var(--panel2);border-radius:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.duration{position:absolute;bottom:7px;right:7px;background:#000c;color:white;padding:3px 5px;border-radius:4px;font-size:12px}.details{display:flex;gap:11px;padding-top:12px}.channel-icon{flex-shrink:0;width:37px;height:37px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:bold}.vtitle{font-size:15px;font-weight:600;line-height:1.35;margin:0 0 7px}.meta{color:var(--muted);line-height:1.5;font-size:13px}.empty{text-align:center;padding:60px 15px;color:var(--muted)}.section-title{font-size:23px;margin:4px 0 20px}.shorts-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.short{cursor:pointer}.short img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:var(--panel2)}.short p{font-weight:600;line-height:1.35}.playlist-form{display:flex;gap:8px;max-width:500px;margin-bottom:22px}.playlist-form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--text)}.primary{background:var(--text);color:var(--bg);border-radius:20px;padding:10px 16px;font-weight:bold}.playlist-list{display:flex;gap:10px;flex-wrap:wrap}.playlist-card{background:var(--panel);padding:16px;border-radius:10px;min-width:160px}.playlist-card button{background:var(--panel2);border-radius:7px;padding:7px;margin-top:8px}.modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{width:min(900px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.modal-title{font-size:18px;font-weight:bold;margin:13px 0}.player-actions{display:flex;gap:8px;flex-wrap:wrap}.player-actions button{background:var(--panel2);border-radius:18px;padding:9px 13px}.mobile-nav{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:9px;display:none;z-index:30}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shorts-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.sidebar{width:75px}.sidebar .label,.sidebar .navlabel,.sidebar .separator{display:none}.navbtn{justify-content:center;padding:13px 5px}.navbtn .ico{font-size:21px}}
@media(max-width:650px){header{padding:0 10px;gap:10px}.brand{font-size:0;gap:0}.logo{width:32px}.head-actions{gap:4px}.round{width:34px;height:34px}.search button{padding:0 13px}.sidebar{display:none}.main{padding:14px 10px 78px}.grid{grid-template-columns:1fr;gap:24px}.thumb{border-radius:9px}.details{padding-top:9px}.chips{padding-bottom:16px}.shorts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);z-index:8;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}.mobile-nav span{font-size:20px}.head-actions .hide-mobile{display:none}}
</style>
</head>
<body>
<header>
  <button class="round" id="menuBtn" aria-label="Toggle navigation">☰</button>
  <div class="brand"><span class="logo"></span>YouTube</div>
  <form class="search" id="searchForm"><input id="searchInput" placeholder="Search" aria-label="Search videos"><button aria-label="Search">⌕</button></form>
  <div class="head-actions"><button class="round hide-mobile" id="themeBtn" title="Toggle dark mode">☼</button><button class="round" id="historyBtn" title="History">◷</button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <button class="navbtn active" data-page="home"><span class="ico">⌂</span><span class="label">Home</span></button>
  <button class="navbtn" data-page="shorts"><span class="ico">▶</span><span class="label">Shorts</span></button>
  <button class="navbtn" data-page="subscriptions"><span class="ico">▣</span><span class="label">Subscriptions</span></button>
  <div class="separator"></div><div class="navlabel">You</div>
  <button class="navbtn" data-page="playlists"><span class="ico">▤</span><span class="label">Playlists</span></button>
  <button class="navbtn" data-page="history"><span class="ico">◷</span><span class="label">History</span></button>
  <button class="navbtn" data-page="liked"><span class="ico">♡</span><span class="label">Liked videos</span></button>
</aside>
<main class="main" id="main">
  <div class="chips" id="chips"></div>
  <div id="content"></div>
</main>
</div>
<nav class="mobile-nav">
  <button data-page="home"><span>⌂</span>Home</button><button data-page="shorts"><span>▶</span>Shorts</button><button data-page="subscriptions"><span>▣</span>Subscriptions</button><button data-page="playlists"><span>▤</span>Library</button>
</nav>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong>Now playing</strong><button class="round" id="closeModal">×</button></div><div class="player" id="player"></div><div class="modal-title" id="modalTitle"></div><div class="player-actions"><button id="saveVideo">＋ Save to playlist</button><button id="shareVideo">↗ Share</button><button id="openYoutube">Open on YouTube ↗</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const videos=[
{id:"jNQXAC9IVRw",title:"Me at the zoo",channel:"jawed",views:"380M views",age:"19 years ago",duration:"0:19",category:"Entertainment",avatar:"J",thumb:"https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg"},
{id:"aqz-KE-bpKQ",title:"Big Buck Bunny — animated short film",channel:"Blender",views:"20M views",age:"10 years ago",duration:"9:56",category:"Film & Animation",avatar:"B",thumb:"https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg"},
{id:"ScMzIvxBSi4",title:"Relaxing nature scenes",channel:"Nature Clips",views:"2.1M views",age:"2 years ago",duration:"3:00",category:"Nature",avatar:"N",thumb:"https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg"},
{id:"ysz5S6PUM-U",title:"Sample video — beautiful scenery",channel:"Video Samples",views:"850K views",age:"3 years ago",duration:"0:30",category:"Travel",avatar:"V",thumb:"https://i.ytimg.com/vi/ysz5S6PUM-U/hqdefault.jpg"},
{id:"kJQP7kiw5Fk",title:"Luis Fonsi — Despacito (Official Music Video)",channel:"Luis Fonsi",views:"8B views",age:"9 years ago",duration:"4:42",category:"Music",avatar:"L",thumb:"https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg"},
{id:"fJ9rUzIMcZQ",title:"Queen — Bohemian Rhapsody (Official Video)",channel:"Queen Official",views:"1.8B views",age:"15 years ago",duration:"6:00",category:"Music",avatar:"Q",thumb:"https://i.ytimg.com/vi/fJ9rUzIMcZQ/hqdefault.jpg"},
{id:"9bZkp7q19f0",title:"PSY — GANGNAM STYLE (강남스타일) M/V",channel:"officialpsy",views:"5B views",age:"14 years ago",duration:"4:13",category:"Music",avatar:"P",thumb:"https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg"},
{id:"M7lc1UVf-VE",title:"YouTube player demo",channel:"YouTube Developers",views:"1.2M views",age:"11 years ago",duration:"0:30",category:"Education",avatar:"Y",thumb:"https://i.ytimg.com/vi/M7lc1UVf-VE/hqdefault.jpg"},
{id:"L_jWHffIx5E",title:"Smash Mouth — All Star (Official Music Video)",channel:"Smash Mouth",views:"500M views",age:"15 years ago",duration:"3:57",category:"Music",avatar:"S",thumb:"https://i.ytimg.com/vi/L_jWHffIx5E/hqdefault.jpg"},
{id:"tgbNymZ7vqY",title:"The Muppets: Bohemian Rhapsody",channel:"The Muppets",views:"100M views",age:"15 years ago",duration:"5:34",category:"Comedy",avatar:"M",thumb:"https://i.ytimg.com/vi/tgbNymZ7vqY/hqdefault.jpg"},
{id:"e-ORhEE9VVg",title:"Taylor Swift — Blank Space",channel:"Taylor Swift",views:"3.5B views",age:"11 years ago",duration:"4:33",category:"Music",avatar:"T",thumb:"https://i.ytimg.com/vi/e-ORhEE9VVg/hqdefault.jpg"},
{id:"CevxZvSJLk8",title:"Katy Perry — Roar (Official)",channel:"Katy Perry",views:"4B views",age:"13 years ago",duration:"4:30",category:"Music",avatar:"K",thumb:"https://i.ytimg.com/vi/CevxZvSJLk8/hqdefault.jpg"}
];
const categories=["All","Music","Gaming","Live","Mixes","Comedy","Film & Animation","Nature","Travel","Education"];
let page="home",category="All",query="",currentVideo=null,history=JSON.parse(localStorage.getItem("ytclone-history")||"[]"),liked=JSON.parse(localStorage.getItem("ytclone-liked")||"[]"),playlists=JSON.parse(localStorage.getItem("ytclone-playlists")||"[]");
const content=document.getElementById("content"),chips=document.getElementById("chips");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderChips(){chips.style.display=page==="home"||page==="subscriptions"?"flex":"none";chips.innerHTML=categories.map(c=>`<button class="chip ${category===c?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");}
function card(v,short=false){return `<article class="${short?"short":"video"}" data-video="${v.id}">${short?`<img loading="lazy" src="${v.thumb.replace("hqdefault","mqdefault")}" alt="">`: `<div class="thumb"><img loading="lazy" src="${v.thumb}" alt="" onerror="this.style.opacity=.25"><span class="duration">${v.duration}</span></div>`}${short?`<p>${esc(v.title)}</p><div class="meta">${esc(v.views)}</div>`:`<div class="details"><div class="channel-icon">${esc(v.avatar)}</div><div><p class="vtitle">${esc(v.title)}</p><div class="meta">${esc(v.channel)}<br>${esc(v.views)} · ${esc(v.age)}</div></div><button class="more" data-more="${v.id}" title="More options">⋮</button></div>`}</article>`}
function listForPage(){let list=[...videos];if(query)list=list.filter(v=>(v.title+" "+v.channel+" "+v.category).toLowerCase().includes(query.toLowerCase()));if(category!=="All")list=list.filter(v=>v.category===category);
if(page==="history")list=history.map(id=>videos.find(v=>v.id===id)).filter(Boolean);
if(page==="liked")list=liked.map(id=>videos.find(v=>v.id===id)).filter(Boolean);
if(page==="subscriptions")list=list.filter(v=>["Music","Entertainment"].includes(v.category));
return list;}
function render(){renderChips();document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="playlists"){content.innerHTML=`<h1 class="section-title">Playlists</h1><form class="playlist-form" id="playlistForm"><input id="playlistName" placeholder="New playlist name" required maxlength="60"><button class="primary">Create</button></form><div class="playlist-list">${playlists.map((p,i)=>`<div class="playlist-card"><strong>▤ ${esc(p.name)}</strong><div class="meta">${p.ids.length} videos</div><button data-playlist="${i}">View playlist</button> <button data-delete-playlist="${i}">Delete</button></div>`).join("")||'<p class="meta">Create a playlist to save videos for later.</p>'}</div><div id="playlistVideos"></div>`;return;}
if(page==="shorts"){let list=listForPage();content.innerHTML=`<h1 class="section-title">Shorts</h1><div class="shorts-grid">${list.map(v=>card(v,true)).join("")}</div>${list.length?"":'<div class="empty">No videos found. Try another search.</div>'}`;return;}
let list=listForPage();let title=page==="history"?"History":page==="liked"?"Liked videos":page==="subscriptions"?"Subscriptions":query?`Search results for “${esc(query)}”`:"";content.innerHTML=(title?`<h1 class="section-title">${title}</h1>`:"")+`<div class="grid">${list.map(v=>card(v)).join("")}</div>${list.length?"":`<div class="empty"><h3>No videos found</h3><p>Try another search or category.</p></div>`}`;
}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2100)}
function play(id){let v=videos.find(x=>x.id===id);if(!v)return;currentVideo=v;history=[id,...history.filter(x=>x!==id)].slice(0,100);localStorage.setItem("ytclone-history",JSON.stringify(history));document.getElementById("modalTitle").textContent=v.title;document.getElementById("player").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;document.getElementById("modal").classList.add("open");}
function closePlayer(){document.getElementById("modal").classList.remove("open");document.getElementById("player").innerHTML="";currentVideo=null;}
document.getElementById("closeModal").onclick=closePlayer;document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closePlayer()});
document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault();query=document.getElementById("searchInput").value.trim();page="home";category="All";render()});
document.getElementById("searchInput").addEventListener("input",e=>{if(!e.target.value.trim()){query="";render()}});
document.getElementById("themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");localStorage.setItem("ytclone-light",document.documentElement.classList.contains("light"))};
if(localStorage.getItem("ytclone-light")==="true")document.documentElement.classList.add("light");
document.getElementById("historyBtn").onclick=()=>{page="history";query="";render()};
document.getElementById("menuBtn").onclick=()=>{let s=document.getElementById("sidebar");if(innerWidth<=650){s.style.display=s.style.display==="block"?"none":"block";s.style.position="fixed";s.style.zIndex=10;s.style.background="var(--bg)";s.style.width="220px";s.style.top="58px";s.style.boxShadow="0 8px 30px #0008"}else{s.style.display=s.style.display==="none"?"block":"none"}};
document.addEventListener("click",async e=>{let nav=e.target.closest("[data-page]");if(nav){page=nav.dataset.page;query="";category="All";document.getElementById("searchInput").value="";render();return}let cat=e.target.closest("[data-cat]");if(cat){category=cat.dataset.cat;render();return}let more=e.target.closest("[data-more]");if(more){e.stopPropagation();let v=videos.find(x=>x.id===more.dataset.more);currentVideo=v;let action=prompt(`Options for "${v.title}"\nType: like, playlist, or cancel`);if(action==="like"){liked=[v.id,...liked.filter(x=>x!==v.id)];localStorage.setItem("ytclone-liked",JSON.stringify(liked));toast("Added to Liked videos")}else if(action==="playlist"){if(!playlists.length){toast("Create a playlist first");page="playlists";render()}else{let n=prompt("Enter playlist number:\n"+playlists.map((p,i)=>`${i+1}. ${p.name}`).join("\n"));let p=playlists[Number(n)-1];if(p&&!p.ids.includes(v.id)){p.ids.push(v.id);savePlaylists();toast("Saved to playlist")}}}currentVideo=null;return}let item=e.target.closest("[data-video]");if(item){play(item.dataset.video);return}let pl=e.target.closest("[data-playlist]");if(pl){let p=playlists[+pl.dataset.playlist];let list=p.ids.map(id=>videos.find(v=>v.id===id)).filter(Boolean);document.getElementById("playlistVideos").innerHTML=`<h2>${esc(p.name)}</h2><div class="grid">${list.map(v=>card(v)).join("")}</div>${list.length?"":"<p class='meta'>This playlist is empty.</p>"}`;return}let del=e.target.closest("[data-delete-playlist]");if(del){playlists.splice(+del.dataset.deletePlaylist,1);savePlaylists();render();return}});
function savePlaylists(){localStorage.setItem("ytclone-playlists",JSON.stringify(playlists))}
document.addEventListener("submit",e=>{if(e.target.id==="playlistForm"){e.preventDefault();let name=document.getElementById("playlistName").value.trim();if(name){playlists.push({name,ids:[]});savePlaylists();render();toast("Playlist created")}}});
document.getElementById("saveVideo").onclick=()=>{if(!currentVideo)return;if(!playlists.length){closePlayer();page="playlists";render();toast("Create a playlist first");return}let choice=prompt("Save to playlist:\n"+playlists.map((p,i)=>`${i+1}. ${p.name}`).join("\n"));let p=playlists[Number(choice)-1];if(p){if(!p.ids.includes(currentVideo.id))p.ids.push(currentVideo.id);savePlaylists();toast("Saved to "+p.name)}};
document.getElementById("shareVideo").onclick=async()=>{if(!currentVideo)return;let url="https://www.youtube.com/watch?v="+currentVideo.id;try{if(navigator.share)await navigator.share({title:currentVideo.title,url});else{await navigator.clipboard.writeText(url);toast("Video link copied")}}catch(err){}};
document.getElementById("openYoutube").onclick=()=>{if(currentVideo)window.open("https://www.youtube.com/watch?v="+currentVideo.id,"_blank","noopener")};
render();
</script>
</body>
</html>
